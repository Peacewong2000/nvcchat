<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>家庭理財非暴力溝通 (NVC) 互動練習器 - 情感語音通話版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #faf8f5;
      color: #2c2825;
    }
    .chat-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .chat-scroll::-webkit-scrollbar-thumb {
      background-color: #d6cfc7;
      border-radius: 3px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.35s ease-out forwards;
    }
    @keyframes pulseRing {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .mic-listening {
      animation: pulseRing 1.6s infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-stone-200 px-4 py-3 sticky top-0 z-20 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-amber-700 text-white flex items-center justify-center font-bold text-lg shadow-sm shrink-0">
          心
        </div>
        <div>
          <h1 class="font-bold text-stone-800 text-base sm:text-lg leading-tight">家庭理財溝通實戰室</h1>
          <p class="text-xs text-stone-500 hidden sm:block">基於非暴力溝通 (NVC) 原理 · 情感粵語真人通話</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- 妻子語音朗讀開關 -->
        <button id="toggle-tts-btn" onclick="toggleAutoTTS()" class="text-xs bg-amber-50 hover:bg-amber-100 text-amber-800 px-3 py-1.5 rounded-lg font-medium transition border border-amber-200 flex items-center gap-1.5" title="切換 AI 妻子自動廣東話朗讀">
          <span id="tts-icon">🔊</span>
          <span id="tts-label" class="hidden sm:inline">粵語女聲：開</span>
        </button>

        <button id="reset-btn" onclick="resetApp()" class="hidden text-xs bg-stone-100 hover:bg-stone-200 text-stone-700 px-3 py-1.5 rounded-lg font-medium transition">
          重新開始
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 flex flex-col">

    <!-- 1. 情境介紹與開始畫面 -->
    <section id="intro-screen" class="bg-white rounded-2xl border border-stone-200 shadow-sm p-6 sm:p-8 my-auto animate-fade-in">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-50 border border-amber-200 text-amber-800 text-xs font-semibold mb-4">
        <span>試用情境一</span>
        <span>·</span>
        <span>高回報養老投資騙局</span>
      </div>
      
      <h2 class="text-2xl sm:text-3xl font-bold text-stone-800 mb-3">
        當發現另一半誤信騙局，失去近半退休積蓄……
      </h2>
      <p class="text-stone-600 leading-relaxed mb-6">
        在這個模擬練習中，你將扮演<strong>丈夫</strong>的角色。你的妻子剛剛發現自己誤信熟人介紹的「10厘高回報養老投資」騙局，痛失了兩人辛苦儲下的 <strong>50 萬退休積蓄</strong>。她此刻極度恐慌、內疚，正吞吞吐吐地想向你坦白。
      </p>

      <div class="grid sm:grid-cols-2 gap-4 mb-6">
        <div class="bg-stone-50 rounded-xl p-4 border border-stone-200/80">
          <h3 class="font-bold text-stone-800 text-sm mb-2 flex items-center gap-1.5">
            <span class="text-amber-600">🎯</span> 你的溝通目標
          </h3>
          <ul class="text-sm text-stone-600 space-y-1.5">
            <li>• 覺察並安頓自己的震驚與憤怒（先處理情緒）</li>
            <li>• 營造安全感，讓妻子願意說出整件事的經過</li>
            <li>• 理解她背後的善意動機（想幫輕你、為退休打算）</li>
